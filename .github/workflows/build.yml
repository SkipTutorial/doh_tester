name: 'CI/CD Pipeline'

on:
  push:
    branches: ['main', 'dev']
    tags: ['v*']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly security scan

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: doh_tester
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────
  # YAML Validation (always runs first)
  # ────────────────────────────────────────────────────────────
  validate-workflow:
    name: 'Validate YAML Syntax'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.6.26/actionlint_1.6.26_linux_amd64.tar.gz
          tar xf actionlint_1.6.26_linux_amd64.tar.gz
          sudo mv actionlint_1.6.26_linux_amd64/actionlint /usr/local/bin/
      - name: Run actionlint
        run: actionlint

  # ────────────────────────────────────────────────────────────
  # Format Check (fast fail)
  # ────────────────────────────────────────────────────────────
  format:
    name: 'Check Code Formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: 'Cache cargo registry'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: format-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: format-${{ runner.os }}-cargo-

      - name: 'Check formatting'
        run: cargo fmt --all -- --check

  # ────────────────────────────────────────────────────────────
  # Lint (runs in parallel with format)
  # ────────────────────────────────────────────────────────────
  lint:
    name: 'Run Clippy Lints'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: 'Cache cargo registry'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: lint-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: lint-${{ runner.os }}-cargo-

      - name: 'Run clippy'
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ────────────────────────────────────────────────────────────
  # Security Audit (low cost, runs in parallel)
  # ────────────────────────────────────────────────────────────
  security:
    name: 'Security Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@stable

      - name: 'Install cargo-audit'
        run: cargo install cargo-audit --locked

      - name: 'Run security audit'
        run: cargo audit

  # ────────────────────────────────────────────────────────────
  # Dependency Check (ensure fresh dependencies)
  # ────────────────────────────────────────────────────────────
  deps-check:
    name: 'Check Dependencies'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@stable

      - name: 'Install cargo-outdated'
        run: cargo install cargo-outdated --locked

      - name: 'Check for outdated dependencies'
        run: |
          cargo outdated --exit-code 1 || echo "⚠️ Some dependencies are outdated"
          exit 0

  # ────────────────────────────────────────────────────────────
  # Test (matrix on Linux only for free tier)
  # ────────────────────────────────────────────────────────────
  test:
    name: 'Test (${{ matrix.rust }})'
    needs: [validate-workflow, format]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ['stable', 'beta', 'nightly']
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: 'Cache cargo registry'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ matrix.rust }}-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: test-${{ matrix.rust }}-${{ runner.os }}-cargo-

      - name: 'Run tests'
        run: cargo test --verbose -- --test-threads=1

      - name: 'Generate coverage (stable only)'
        if: matrix.rust == 'stable'
        uses: actions-rs/tarpaulin@v0.1
        with:
          args: '--out Xml -- --test-threads=1'

      - name: 'Upload coverage to Codecov (stable only)'
        if: matrix.rust == 'stable'
        uses: codecov/codecov-action@v4
        with:
          files: ./cobertura.xml
          fail_ci_if_error: false

  # ────────────────────────────────────────────────────────────
  # Cross-Platform Build (only on tags/main)
  # ────────────────────────────────────────────────────────────
  build:
    name: 'Build (${{ matrix.target }})'
    needs: [lint, test]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: doh_tester
            archive: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: doh_tester
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: doh_tester.exe
            archive: zip
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: doh_tester
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: doh_tester
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: 'Install Rust toolchain'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: 'Cache cargo registry'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: build-${{ matrix.target }}-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: build-${{ matrix.target }}-${{ runner.os }}-cargo-

      - name: 'Install cross-compilation tools (musl)'
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: 'Build release binary'
        run: cargo build --release --target ${{ matrix.target }}

      - name: 'Create staging directory'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ matrix.target }}"
          mkdir -p "$STAGING"
          cp "target/${{ matrix.target }}/release/${{ matrix.artifact }}" "$STAGING/"
          cp README.md LICENSE config.json doh.txt "$STAGING/" 2>/dev/null || true

      - name: 'Create tar.gz archive'
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ matrix.target }}"
          tar czf "${STAGING}.tar.gz" "$STAGING"
          SIZE=$(du -h "${STAGING}.tar.gz" | cut -f1)
          echo "ASSET=${STAGING}.tar.gz" >> "$GITHUB_ENV"
          echo "SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "📦 Archive size: ${SIZE}"

      - name: 'Create zip archive'
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          STAGING="${{ env.BINARY_NAME }}-${{ matrix.target }}"
          7z a "${STAGING}.zip" "$STAGING"
          SIZE=$(du -h "${STAGING}.zip" | cut -f1)
          echo "ASSET=${STAGING}.zip" >> "$GITHUB_ENV"
          echo "SIZE=${SIZE}" >> "$GITHUB_ENV"
          echo "📦 Archive size: ${SIZE}"

      - name: 'Upload build artifact'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: ${{ env.ASSET }}
          retention-days: 30

      - name: 'Report build size'
        run: |
          echo "Build size for ${{ matrix.target }}: ${{ env.SIZE }}"

  # ────────────────────────────────────────────────────────────
  # Release (only on version tags)
  # ────────────────────────────────────────────────────────────
  release:
    name: 'Create GitHub Release'
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: 'Download all build artifacts'
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 'Display artifacts'
        run: |
          echo "📦 Generated artifacts:"
          find artifacts -type f | sort

      - name: 'Create checksums'
        run: |
          cd artifacts
          sha256sum */*.tar.gz */*.zip > checksums.txt
          cat checksums.txt

      - name: 'Create GitHub Release'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 'Notify on release'
        run: |
          echo "🎉 Release ${{ github.ref_name }} created successfully!"
