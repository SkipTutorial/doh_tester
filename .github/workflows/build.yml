name: 'CI/CD Pipeline'

on:
  push:
    branches: ['main', 'dev']
    tags: ['v*']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: doh_tester
  RUST_BACKTRACE: 1

jobs:
  # ────────────────────────────────────────────────────────────
  # YAML Validation
  # ────────────────────────────────────────────────────────────
  validate-yaml:
    name: 'Validate YAML Syntax'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          wget -q https://github.com/rhysd/actionlint/releases/download/v1.6.26/actionlint_1.6.26_linux_amd64.tar.gz
          tar xf actionlint_1.6.26_linux_amd64.tar.gz
          sudo mv actionlint_1.6.26_linux_amd64/actionlint /usr/local/bin/

      - name: Run actionlint
        run: actionlint .github/workflows/*.yml

  # ────────────────────────────────────────────────────────────
  # Format Check
  # ────────────────────────────────────────────────────────────
  format:
    name: 'Check Code Formatting'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: format-${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: format-${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ────────────────────────────────────────────────────────────
  # Lint
  # ─────────────────────────────────────────────────
