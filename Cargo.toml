[package]
name = "doh_tester"
version = "1.0.0"
edition = "2021"
description = "High-performance DNS-over-HTTPS endpoint tester"
authors = ["DoH Tester Contributors"]
repository = "https://github.com/SkipTutorial/doh_tester"
homepage = "https://github.com/SkipTutorial/doh_tester"
license = "MIT"
readme = "README.md"
keywords = ["dns", "doh", "dns-over-https", "tester", "privacy"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
tokio = { version = "1.35", features = ["macros", "rt-multi-thread", "net", "time", "signal"] }
reqwest = { version = "0.11", features = ["json", "native-tls", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
native-tls = "0.2"

[dev-dependencies]
tempfile = "3.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
